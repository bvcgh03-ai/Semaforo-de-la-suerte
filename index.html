<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo de Lugones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.contenedor {
  display: flex;
  flex-direction: column;   /* 🔹 uno debajo del otro */
  align-items: center;      /* 🔹 centrado horizontal */
  gap: 30px;                /* espacio entre logo y texto */
}

#logo {
  width: 220px;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 25px white;
}

#resultado {
  font-size: 40px;
  font-weight: bold;
  text-align: center;
}
</style>
</head>

<body>

<div class="contenedor">
  <img src="logo.png" id="logo" onclick="jugar()">
  <div id="resultado">---</div>
</div>

<script>
let charac;

async function jugar() {
  if (navigator.vibrate) navigator.vibrate(200);

  if (!charac) await conectar();

  charac.writeValue(
    new TextEncoder().encode("J")
  );
}

async function conectar() {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ name: 'ESP32_Ruleta' }],
    optionalServices: ['12345678-1234-1234-1234-123456789abc']
  });

  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(
    '12345678-1234-1234-1234-123456789abc'
  );

  charac = await service.getCharacteristic(
    'abcd1234-1234-1234-1234-abcdef123456'
  );

  charac.startNotifications();
  charac.addEventListener(
    'characteristicvaluechanged',
    e => {
      const v = new TextDecoder().decode(e.target.value);
      document.getElementById("resultado").innerText =
        v === 'R' ? '🔴 ROJO' :
        v === 'A' ? '🟡 AMARILLO' :
        '🟢 VERDE';
    }
  );
}
</script>

</body>
</html>
